<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Soy Tungurahua</title>
  <desc id="desc">Imagen corporativa de Soy Tungurahua: sol andino, volcán Tungurahua, río, hoja, textil andino y comunidad.</desc>
  <defs>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFC22B"/>
      <stop offset="100%" stop-color="#F3A300"/>
    </linearGradient>
    <linearGradient id="mountGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22323A"/>
      <stop offset="100%" stop-color="#0F242D"/>
    </linearGradient>
    <linearGradient id="fieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78BE20"/>
      <stop offset="100%" stop-color="#2F8F5B"/>
    </linearGradient>
    <style>
      .ink{fill:#22323A}.orange{fill:#FF6B35}.green{fill:#2F8F5B}.lime{fill:#78BE20}.gold{fill:#F3A300}.paper{fill:#FFF9F0}.thin{stroke:#FFF9F0;stroke-width:11;stroke-linecap:round;stroke-linejoin:round}.text-main{font-family:Arial,Helvetica,sans-serif;font-weight:800;letter-spacing:1px}.text-sub{font-family:Arial,Helvetica,sans-serif;fill:#4F4A45;letter-spacing:.4px}
    </style>
  </defs>

  <g transform="translate(0,8)">
    <!-- emblem -->
    <g transform="translate(600 330)">
      <!-- sun -->
      <g transform="translate(0 -130)">
        <g fill="url(#sunGrad)">
          <polygon points="0,-156 20,-105 -20,-105"/>
          <polygon points="60,-144 61,-90 27,-102" transform="rotate(22.5)"/>
          <polygon points="60,-144 61,-90 27,-102" transform="rotate(45)"/>
          <polygon points="60,-144 61,-90 27,-102" transform="rotate(67.5)"/>
          <polygon points="60,-144 61,-90 27,-102" transform="rotate(90)"/>
          <polygon points="60,-144 61,-90 27,-102" transform="rotate(112.5)"/>
          <polygon points="60,-144 61,-90 27,-102" transform="rotate(135)"/>
          <polygon points="60,-144 61,-90 27,-102" transform="rotate(157.5)"/>
          <polygon points="60,-144 61,-90 27,-102" transform="rotate(180)"/>
          <polygon points="60,-144 61,-90 27,-102" transform="rotate(202.5)"/>
          <polygon points="60,-144 61,-90 27,-102" transform="rotate(225)"/>
          <polygon points="60,-144 61,-90 27,-102" transform="rotate(247.5)"/>
          <polygon points="60,-144 61,-90 27,-102" transform="rotate(270)"/>
          <polygon points="60,-144 61,-90 27,-102" transform="rotate(292.5)"/>
          <polygon points="60,-144 61,-90 27,-102" transform="rotate(315)"/>
          <polygon points="60,-144 61,-90 27,-102" transform="rotate(337.5)"/>
        </g>
        <circle r="118" fill="url(#sunGrad)"/>
        <circle r="93" fill="none" stroke="#FFF9F0" stroke-width="12"/>
        <path d="M-68 -26 -42 -64 -15 -26 13 -64 39 -26 67 -64 67 26 39 -12 13 26 -15 -12 -42 26 -68 -12Z" fill="none" stroke="#FFF9F0" stroke-width="10" stroke-linejoin="round"/>
      </g>

      <!-- main circular composition -->
      <circle r="210" fill="#FFFFFF" stroke="#F0E1D0" stroke-width="8"/>

      <!-- volcano -->
      <path d="M-162 34 -26 -112 18 -82 56 -114 176 34 74 34 10 -28 -60 34Z" fill="url(#mountGrad)"/>
      <path d="M-42 -95 -10 -122 18 -96 5 -88 -8 -60 -20 -88Z" class="paper"/>
      <path d="M18 -98 56 -130 95 -92 65 -88 48 -51 32 -83Z" class="paper"/>
      <path d="M-91 -28 -44 -74 -24 -20 -41 -6Z" class="paper" opacity=".96"/>
      <path d="M105 -16 143 18 78 18Z" class="paper" opacity=".96"/>
      <path d="M0 -138c-16-18-2-36 15-52 12 18 15 38 0 49 15-4 27-15 31-31 16 29 6 60-24 65-22 4-40-9-40-27 0-11 7-21 18-27-2 11 0 18 10 23-2-11 2-19 12-27 1 11-1 21-10 27z" class="orange"/>

      <!-- fields and river -->
      <path d="M-135 68c41-37 85-58 133-63 58-6 119 8 174 41v129H-160c7-42 17-74 25-107z" fill="#3D8B1D"/>
      <path d="M-150 182c26-89 72-139 148-156 73-16 140 0 204 52" fill="none" stroke="#78BE20" stroke-width="18" stroke-linecap="round"/>
      <path d="M-156 214c30-79 88-127 173-145 63-13 124-6 186 21" fill="none" stroke="#68AC1C" stroke-width="18" stroke-linecap="round"/>
      <path d="M-2 23c-24 37-32 86-24 132 5 26 14 47 31 73" fill="none" stroke="#FFF9F0" stroke-width="22" stroke-linecap="round"/>

      <!-- left natural element -->
      <g transform="translate(-162 76)">
        <path d="M14 16c39 0 74 27 88 65-47 6-89-14-110-48-15 24-17 54-4 84 43-11 75-38 92-76 15-32 10-62-16-82-13-10-29-15-50-15z" class="lime"/>
        <path d="M54 126c40 7 72 35 82 70-47 0-86-22-103-57-18 18-26 44-20 75 41-6 75-30 98-67 18-31 17-61-3-84-12-14-30-24-54-27z" class="green"/>
        <path d="M71 37c-9 22-21 43-35 63" fill="none" stroke="#4E9A1C" stroke-width="6" stroke-linecap="round"/>
        <path d="M103 148c-8 16-20 34-36 48" fill="none" stroke="#236D46" stroke-width="6" stroke-linecap="round"/>
      </g>

      <!-- right textile motif -->
      <g transform="translate(153 96)">
        <path d="M0 -84 84 0 0 84 -84 0Z" class="orange"/>
        <path d="M0 -53 53 0 0 53 -53 0Z" class="paper"/>
        <path d="M0 -25 25 0 0 25 -25 0Z" class="orange"/>
        <path d="M-106 -16 -80 -42 -22 16 4 -10 66 52 40 78 -22 16 -48 42Z" class="orange" opacity=".95"/>
        <path d="M-52 -98 -26 -72 34 -132 60 -106 0 -46 -26 -72Z" class="orange" opacity=".95"/>
      </g>

      <!-- berries / flower accent -->
      <g transform="translate(-178 185)">
        <circle cx="18" cy="0" r="15" class="orange"/>
        <circle cx="52" cy="-14" r="15" class="orange"/>
        <circle cx="84" cy="0" r="15" class="orange"/>
        <circle cx="36" cy="31" r="15" class="orange"/>
      </g>

      <!-- community at base -->
      <g transform="translate(-102 185)">
        <g transform="translate(0 0)" class="green"><circle cx="0" cy="0" r="17"/><path d="M-27 47c6-22 21-34 40-34s34 12 40 34Z"/></g>
        <g transform="translate(78 -5)" class="lime"><circle cx="0" cy="0" r="17"/><path d="M-27 47c6-22 21-34 40-34s34 12 40 34Z"/></g>
        <g transform="translate(156 -2)" fill="#F3A300"><circle cx="0" cy="0" r="17"/><path d="M-27 47c6-22 21-34 40-34s34 12 40 34Z"/></g>
        <g transform="translate(234 1)" class="orange"><circle cx="0" cy="0" r="17"/><path d="M-27 47c6-22 21-34 40-34s34 12 40 34Z"/></g>
      </g>
    </g>

    <!-- wordmark -->
    <g transform="translate(600 730)">
      <text class="text-main" text-anchor="middle" font-size="84">
        <tspan fill="#FF6B35">SOY</tspan>
        <tspan fill="#22323A"> TUNGURAHUA</tspan>
      </text>
      <g transform="translate(0 36)">
        <line x1="-210" y1="0" x2="-64" y2="0" stroke="#2F8F5B" stroke-width="6" stroke-linecap="round"/>
        <rect x="-7" y="-7" width="14" height="14" rx="1" transform="rotate(45)" fill="#22323A"/>
        <line x1="64" y1="0" x2="210" y2="0" stroke="#FF6B35" stroke-width="6" stroke-linecap="round"/>
      </g>
      <text class="text-sub" text-anchor="middle" y="88" font-size="28">Red de Cultura, Turismo Consciente y Valor Territorial</text>
    </g>
  </g>
</svg>