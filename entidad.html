*{box-sizing:border-box;min-width:0}html{overflow-x:hidden}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.55}a{color:inherit}.container{width:100%;max-width:1040px;margin:auto;padding:0 20px}header{position:sticky;top:0;z-index:50;background:rgba(255,249,240,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand-logo{display:block;width:clamp(145px,20vw,220px);height:auto;max-height:58px;object-fit:contain}.brand{display:flex;align-items:center;gap:10px;text-decoration:none}.mark{width:44px;height:44px;border-radius:13px;background:#fff url('assets/logo-soy-tungurahua-2026.png') center 27%/185% auto no-repeat;border:1px solid var(--line);flex:0 0 44px}.brand strong{font-size:.92rem;white-space:nowrap}.nav-actions{display:flex;gap:7px}.navlink{display:none;text-decoration:none;font-weight:900;color:var(--green)}.hero{padding:44px 0 34px;background:radial-gradient(circle at 92% 0,rgba(255,213,111,.7),transparent 28%)}.eyebrow{font-size:.72rem;font-weight:950;letter-spacing:.12em;text-transform:uppercase;color:var(--green)}h1{font-size:clamp(2.4rem,10vw,5.1rem);line-height:.92;letter-spacing:-.05em;margin:.45rem 0 1rem}.lead{font-size:1.04rem;color:var(--muted);max-width:780px}.status{display:inline-flex;border:1px solid #f1dda4;background:#fff7da;border-radius:999px;padding:.5rem .72rem;font-size:.8rem;font-weight:900;margin-top:12px}.section{padding:38px 0}.grid{display:grid;grid-template-columns:1fr;gap:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 8px 22px rgba(34,50,58,.04)}.panel h2{font-size:1.45rem;margin:0 0 10px}.fact{padding:12px 0;border-bottom:1px solid var(--line)}.fact:last-child{border:0}.fact b{display:block;font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;color:var(--green);margin-bottom:3px}.fact span{display:block}.notice{background:#fff7da;border-color:#f1dda4}.notice p{color:#5d5747}.source{background:#eef8f0;border-color:#d5e8d9}.source p{color:#365744}.warning{background:#fff7da;border-color:#f1dda4}.warning p{color:#5d5747}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.btn{border-radius:999px;padding:.58rem .75rem;text-decoration:none;font-size:.82rem;font-weight:900;background:var(--dark);color:#fff}.btn.green{background:var(--green)}.btn.orange{background:var(--orange)}footer{background:#151b18;color:#fff;padding:30px 0}.foot{display:grid;gap:12px}.foot a{text-decoration:none;color:#d5ddd8}.project-note{display:block;margin-top:6px;color:#aeb8b2;font-size:.8rem;font-weight:700}@media(min-width:760px){.container{padding:0 28px}.navlink{display:inline}.hero{padding:68px 0 44px}.grid{grid-template-columns:1.1fr .9fr}.span2{grid-column:1/-1}.foot{grid-template-columns:1fr auto;align-items:end}}

<script src="data/catastro-1.js"></script><script src="data/catastro-2.js"></script><script src="data/catastro-3.js"></script><script src="data/catastro-4.js"></script><script src="data/catastro-5.js"></script><script src="data/audit-status.js"></script><script src="data/evidencias.js"></script>
<main id="app"><section class="hero"><div class="container"><div class="eyebrow">Cargando ficha territorial…</div><h1>SOY TUNGURAHUA</h1></div></section></main>
<footer><div class="container foot"><div><strong>SOY TUNGURAHUA</strong><span class="project-note">Proyecto turístico-cultural independiente de Tungurahua.</span></div><div><a href="explorar.html">Explorar</a> · <a href="cantones/">Cantones</a> · <a href="metodologia.html">Metodología</a> · <a href="licencia-datos.html">Licencia de datos</a> · <a href="radio.html">Radio</a></div></div></footer>
<script>
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt',"'":'&#39;','"':'&quot;'}[c]));
const id=new URLSearchParams(location.search).get('id')||'';
const base=(window.CATASTRO||[]).find(x=>x.id===id);
const deep=(window.SOY_EVIDENCIAS||{})[id]||{};
const audit=(window.SOY_AUDIT_STATUS||{})[id]||[];
const app=document.getElementById('app');
const slugMap={'Ambato':'ambato','Baños de Agua Santa':'banos-de-agua-santa','Cevallos':'cevallos','Mocha':'mocha','Patate':'patate','San Pedro de Pelileo':'san-pedro-de-pelileo','Santiago de Píllaro':'santiago-de-pillaro','Quero':'quero','Tisaleo':'tisaleo'};
function fact(label,value){return value?`<div class="fact"><b>${esc(label)}</b><span>${esc(value).replace(/`|\*\*/g,'')}</span></div>`:''}
function refs(items){return Array.isArray(items)&&items.length?`<div class="actions">${items.map(x=>`<a class="btn green" href="${esc(x.url)}" target="_blank" rel="noopener">↗ ${esc(x.titulo)}</a>`).join('')}</div>`:''}
function list(items){return Array.isArray(items)&&items.length?`<div class="fact"><b>Hechos documentados en revisión ampliada</b><span>• ${items.map(esc).join('<br>• ')}</span></div>`:''}
if(!base){document.title='Ficha no encontrada — Soy Tungurahua';app.innerHTML='<section class="hero"><div class="container"><div class="eyebrow">Ficha no encontrada</div><h1>No encontramos ese registro.</h1><p class="lead">La base territorial está en expansión.</p><div class="actions"><a class="btn orange" href="explorar.html">Volver al explorador</a></div></div></section>'}
else{
 const e={...base,...deep};const slug=slugMap[base.canton]||'';const auditState=deep.estado_evidencia||audit[0]||'DOCUMENTACIÓN EN AMPLIACIÓN';const publication=deep.estado_publicacion||audit[1]||'';
 document.title=`${base.nombre} — ${base.canton} | Soy Tungurahua`;
 document.querySelector('meta[name="description"]').content=`${base.nombre}. ${e.descripcion||base.categoria||''}`.slice(0,155);
 document.getElementById('canonical').href=`https://soytungurahua.com/entidad.html?id=${encodeURIComponent(base.id)}`;
 app.innerHTML=`<section class="hero"><div class="container"><div class="eyebrow">${esc(base.canton)} · ${esc(base.id)}</div><h1>${esc(base.nombre)}</h1><p class="lead">${esc(e.descripcion||base.categoria||'Ficha territorial en ampliación.')}</p><div class="status">🟡 ${esc(auditState)}</div></div></section>
 <section class="section"><div class="container grid">
  <article class="panel"><h2>Qué aporta al territorio</h2><p>${esc(e.aporte_territorial||'Este campo se encuentra en ampliación documental.')}</p>${fact('Identificador',base.id)}${fact('Cantón',base.canton)}${fact('Tipo',base.tipo)}${fact('Categoría',base.categoria)}${fact('Ubicación declarada',e.ubicacion)}${fact('Coordenadas / hito declarados',e.coordenadas)}<div class="actions">${slug?`<a class="btn green" href="cantones/#${slug}">Explorar ${esc(base.canton)}</a>`:''}<a class="btn" href="explorar.html?q=${encodeURIComponent(base.nombre)}">Ver conexiones</a><a class="btn orange" href="mapa.html">Abrir mapa</a></div></article>
  <aside class="panel source"><h2>Fuentes y evidencia</h2>${fact('Estado de auditoría',audit[0])}${fact('Estado de evidencia ampliada',deep.estado_evidencia)}${fact('Fuente principal declarada',e.fuente_principal_original)}${fact('Fuentes secundarias declaradas',e.fuentes_secundarias_originales)}${refs(e.referencias_publicas)}<p><strong>Importante:</strong> una fuente declarada como “Nivel A” en la investigación original no se considera automáticamente verificada si la entrevista, visita o documento no está disponible para comprobación.</p></aside>
  ${e.revision_documental?`<article class="panel source span2"><h2>Revisión documental ampliada</h2><p>${esc(e.revision_documental)}</p>${list(e.hechos_documentados)}</article>`:''}
  <article class="panel warning span2"><h2>Estado de investigación</h2>${fact('Auditoría del conjunto',audit[0])}${fact('Publicación recomendada',publication)}${fact('Nota de auditoría',e.nota_auditoria)}${fact('Pendiente',e.pendientes_originales)}<p>La ficha no equivale a certificación oficial, inventario patrimonial ni valoración comercial. Soy Tungurahua conserva los pendientes porque una cartografía confiable también debe mostrar lo que todavía no sabe.</p></article>
  <article class="panel span2"><h2>Red territorial</h2>${fact('Contacto público consignado',e.contacto_publico)}${fact('Gremios / redes y programas',e.gremios_redes)}${fact('Visibilidad / prioridad original',e.visibilidad_institucional)}${fact('Membresía Soy Tungurahua',base.membresia)}<div class="actions"><a class="btn" href="metodologia.html">Cómo leer las fuentes</a><a class="btn green" href="explorar.html?q=${encodeURIComponent(base.canton)}">Explorar el cantón</a><a class="btn orange" href="licencia-datos.html">Licencia y reutilización</a></div></article>
 </div></section>`;
 const ld={'@context':'https://schema.org','@type':(base.tipo||'').includes('Persona')?'Person':(base.tipo||'').includes('Lugar')?'Place':'Thing','identifier':base.id,'name':base.nombre,'description':e.descripcion||base.categoria,'isPartOf':{'@type':'Dataset','@id':'https://soytungurahua.com/#dataset-cartografia-territorial','name':'Cartografía territorial Soy Tungurahua','description':'Conjunto de datos territorial en evolución que reúne fichas de actores, lugares, oficios, cultura, naturaleza, fuentes y estados de verificación documental de los nueve cantones de Tungurahua, Ecuador.','creator':{'@type':'Organization','name':'Observatorio Cultural Independiente'},'publisher':{'@type':'Organization','name':'Soy Tungurahua','url':'https://soytungurahua.com/'},'license':'https://creativecommons.org/licenses/by-nc-nd/4.0/','usageInfo':'https://soytungurahua.com/licencia-datos.html','isAccessibleForFree':true,'keywords':['Tungurahua','Ecuador','cartografía territorial','cultura','turismo consciente','actores territoriales','datos culturales']},'containedInPlace':{'@type':'AdministrativeArea','name':base.canton,'containedInPlace':{'@type':'AdministrativeArea','name':'Tungurahua','containedInPlace':{'@type':'Country','name':'Ecuador'}}}};
 const sc=document.createElement('script');sc.type='application/ld+json';sc.textContent=JSON.stringify(ld);document.head.appendChild(sc)
}
</script></body></html>
