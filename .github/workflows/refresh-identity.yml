name: Refresh Soy Tungurahua identity
on:
  push:
    branches: [main]
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply typography, logo and passport navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          css=Path('assets/atlas-vivo.css')
          s=css.read_text()
          font="@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap');\n"
          if not s.lstrip().startswith('@import url(\'https://fonts.googleapis.com'):
              s=font+s
          marker='/* Identidad tipográfica 2026 — Soy Tungurahua */'
          if marker not in s:
              s += '''\n\n/* Identidad tipográfica 2026 — Soy Tungurahua */\nbody[class^="atlas-"]{font-family:'Manrope',ui-sans-serif,system-ui,sans-serif}\nbody[class^="atlas-"] h1,body[class^="atlas-"] h2,body[class^="atlas-"] h3{font-family:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif}\nbody[class^="atlas-"] .brand-logo{content:url('logo-header.svg')}\nbody[class^="atlas-"] header .brand{background:var(--white);padding:6px 10px;border-radius:15px;box-shadow:0 7px 20px rgba(0,0,0,.18)}\nbody[class^="atlas-"] header .brand-logo{width:176px;max-width:176px;max-height:42px;filter:none}\n@media(max-width:620px){body[class^="atlas-"] header .brand-logo{width:148px;max-width:148px;max-height:36px}}\n'''
          css.write_text(s)
          for fn in ['index.html','explorar.html','que-hacer.html','entidad.html']:
              p=Path(fn); t=p.read_text()
              if 'href="pasaporte.html"' not in t:
                  needle='<div class="nav-actions">'
                  if needle in t:
                      t=t.replace(needle,needle+'<a class="navlink passport-link" href="pasaporte.html">✦ Pasaporte</a>',1)
                  else:
                      needle='<div class="navlinks">'
                      if needle in t: t=t.replace(needle,needle+'<a href="pasaporte.html">✦ Pasaporte</a>',1)
                  p.write_text(t)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/atlas-vivo.css index.html explorar.html que-hacer.html entidad.html
          git diff --cached --quiet && exit 0
          git commit -m 'refine typography logo and passport navigation'
          git push
