name: Sync continuous radio player

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-radio-player.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-radio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use shared live radio engine on portal players
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          RADIO_SCRIPT = 'assets/js/radio-live.js?v=20260829-iphone3'
          RADIO_URL = 'https://github.com/FitoGirolami/SoyTungurahua.com/releases/download/radio-v1/radio-soy-tungurahua.mp3'

          def refresh_radio_script(s):
              return re.sub(r'assets/js/radio-live\.js(?:\?[^"\']*)?', RADIO_SCRIPT, s)

          def static_audio(s, audio_id):
              pattern = rf'<audio id="{re.escape(audio_id)}"[^>]*>(?:<source[^>]*></source>|<source[^>]*>)?</audio>'
              replacement = f'<audio id="{audio_id}" preload="auto" loop playsinline><source src="{RADIO_URL}" type="audio/mpeg"></audio>'
              if re.search(pattern, s):
                  return re.sub(pattern, replacement, s, count=1)
              return s

          # Home page
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = static_audio(s, 'homeRadioAudio')
          marker = "<script>\nconst homeRadio=document.getElementById('homeRadioAudio');"
          start = s.find(marker)
          if start != -1:
              end = s.find('</script>', start)
              if end == -1:
                  raise SystemExit('No se encontró cierre del script de radio en index.html')
              end += len('</script>')
              replacement = f'''<script src="{RADIO_SCRIPT}"></script>\n<script>\nSoyTungurahuaRadio.mount({{\n  audio:document.getElementById('homeRadioAudio'),\n  button:document.getElementById('homeRadioPlay'),\n  compact:true\n}});\n</script>'''
              s = s[:start] + replacement + s[end:]
          s = refresh_radio_script(s)
          if 'href="artesanos.html">Artesanos</a>' not in s:
              s = s.replace('<a class="navlink" href="artistas.html">Artistas</a>', '<a class="navlink" href="artistas.html">Artistas</a><a class="navlink" href="artesanos.html">Artesanos</a>', 1)
          if '👐 Artesanos y oficios' not in s:
              s = s.replace('<a href="artistas.html">🎨 Artistas y creadores</a>', '<a href="artistas.html">🎨 Artistas y creadores</a><a href="artesanos.html">👐 Artesanos y oficios</a>', 1)
          p.write_text(s, encoding='utf-8')

          # Semantic explorer
          p = Path('explorar.html')
          s = p.read_text(encoding='utf-8')
          s = static_audio(s, 'radioAudio')
          radio_start = s.find(";const radio=document.getElementById('radioAudio')")
          if radio_start != -1:
              script_end = s.find('</script>', radio_start)
              if script_end == -1:
                  raise SystemExit('No se encontró cierre del script en explorar.html')
              s = s[:radio_start] + ';\n' + s[script_end:]
          insert = f'''<script src="{RADIO_SCRIPT}"></script>\n<script>\nSoyTungurahuaRadio.mount({{\n  audio:document.getElementById('radioAudio'),\n  button:document.getElementById('radioPlay'),\n  compact:true\n}});\n</script>\n'''
          if 'assets/js/radio-live.js' not in s:
              s = s.replace('</body></html>', insert + '</body></html>', 1)
          s = refresh_radio_script(s)
          if 'href="artesanos.html">Artesanos</a>' not in s:
              s = s.replace('<a class="navlink" href="artistas.html">Artistas</a>', '<a class="navlink" href="artistas.html">Artistas</a><a class="navlink" href="artesanos.html">Artesanos</a>', 1)
          p.write_text(s, encoding='utf-8')

          # Dedicated radio page
          p = Path('radio.html')
          s = p.read_text(encoding='utf-8')
          s = static_audio(s, 'radioAudio')
          s = refresh_radio_script(s)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit portal radio sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html explorar.html radio.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Restore static iPhone radio source"
            git push
          fi
